[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loan-extraction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["hydra-core>=1.3", "pydantic>=2", "filetype>=1.2", "pymupdf>=1.24", "pytesseract>=0.3", "pillow>=10", "google-genai>=1.0", "openai>=1.60"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.envs.default]
dependencies = ["pytest", "ruff", "mypy"]

[tool.hatch.envs.default.scripts]
ingest = "python -m app.ingest {args}"
document-worker = "python -m app.document_worker {args}"
redrive = "python -m app.redrive {args}"
costs = "python -m app.costs {args}"
resolve = "python -m app.resolve {args}"
test = "pytest {args}"
lint = ["ruff check .", "ruff format --check .", "mypy app"]
fmt = ["ruff check --fix .", "ruff format ."]

[tool.pytest.ini_options]
# PyMuPDF's SWIG bindings emit these on import; not ours to fix.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.ruff]
line-length = 120
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["filetype", "pytesseract"]
ignore_missing_imports = true
