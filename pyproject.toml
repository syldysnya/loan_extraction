[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loan-extraction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["hydra-core>=1.3", "pydantic>=2", "filetype>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.envs.default]
dependencies = ["pytest", "ruff"]

[tool.hatch.envs.default.scripts]
ingest = "python -m app.ingest {args}"
document-worker = "python -m app.document_worker {args}"
redrive = "python -m app.redrive {args}"
test = "pytest {args}"
lint = ["ruff check .", "ruff format --check ."]
fmt = ["ruff check --fix .", "ruff format ."]

[tool.ruff]
line-length = 120
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
